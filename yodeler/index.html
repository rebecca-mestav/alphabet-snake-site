<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yodeler</title>
<style>
:root{--bg:#f4f1ea;--fg:#2a2a28;--btn:#fff;--bd:#c9c4b8;--ac:#2b6cb0;box-sizing:border-box;
 padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1d1b;--fg:#ecebe6;--btn:#2d2d2a;--bd:#55544e;--ac:#7fb2e5}}
:root[data-theme="dark"]{--bg:#1d1d1b;--fg:#ecebe6;--btn:#2d2d2a;--bd:#55544e;--ac:#7fb2e5}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:16px system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
#app{height:100%;box-sizing:border-box;padding:10px;display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;gap:8px 10px}
#top{grid-column:1/3;grid-row:1;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#scoreBox{margin-left:auto;font-size:18px}
#scoreBox b{font-size:22px}
button,select{font:inherit;color:var(--fg);background:var(--btn);border:1.5px solid var(--bd);border-radius:14px}
button{touch-action:none}
.pill{padding:4px 10px;border-radius:999px}
select{padding:4px 10px;border-radius:999px;max-width:40vw}
#speed{max-width:none}
#pad{grid-column:1;grid-row:2;display:flex;gap:8px;touch-action:none}
.sl{width:60px;position:relative;border:1.5px solid var(--bd);border-radius:14px;background-color:var(--btn);box-sizing:border-box;touch-action:none;
 background-image:repeating-linear-gradient(to bottom,var(--bd) 0 2px,transparent 2px calc(100% / 14))}
.sl span{position:absolute;top:6px;left:0;right:0;text-align:center;font-size:12px;opacity:.7;pointer-events:none}
.knob{position:absolute;left:-2px;right:-2px;height:14px;margin-top:-7px;border-radius:7px;background:var(--ac);pointer-events:none}
#laneWrap{grid-column:2;grid-row:2;position:relative;min-width:0;min-height:0}
#lane{position:absolute;inset:0;width:100%;height:100%;display:block}
#ctl{grid-column:1;grid-row:3;display:flex;gap:6px}
#start,#pause{flex:1;min-width:0;height:clamp(48px,15vh,70px);font-size:16px;font-weight:700}
#pause:disabled{opacity:.4}
#start{font-weight:700;background:var(--ac);border-color:var(--ac);color:#fff}
#row{grid-column:2;grid-row:3;justify-self:end;margin-right:calc(clamp(52px,10vw,84px) + 8px);display:flex;gap:8px;touch-action:none}
.btn{width:clamp(52px,10vw,84px);height:clamp(48px,15vh,70px);font-size:18px;font-weight:700;border:2.5px solid transparent}
.btn.on{box-shadow:0 0 0 3px var(--fg);transform:translateY(2px)}
#rot{display:none}
@media (orientation:portrait){#rot{display:flex;position:fixed;inset:0;z-index:9;background:var(--bg);align-items:center;justify-content:center;font-size:20px}}
</style>
</head>
<body>
<div id="app">
 <div id="top">
  <button id="snap" class="pill">snap on</button>
  <button id="full" class="pill">fullscreen</button>
  <select id="song"></select>
  <select id="speed"><option value="1">100%</option><option value="0.9">90%</option><option value="0.75">75%</option><option value="0.6">60%</option><option value="0.5">50%</option><option value="0.4">40%</option><option value="0.25">25%</option></select>
  <button id="auto" class="pill">auto off</button>
  <span id="scoreBox">Score <b id="score">0</b></span>
 </div>
 <div id="pad">
  <div class="sl" id="slC"><div class="knob" id="kC"></div></div>
  <div class="sl" id="slF"><div class="knob" id="kF"></div></div>
 </div>
 <div id="laneWrap"><canvas id="lane"></canvas></div>
 <div id="ctl"><button id="start">Start</button><button id="pause" disabled>Pause</button></div>
 <div id="row"></div>
</div>
<div id="rot">Rotate your phone to landscape</div>

pad.addEventListener('pointerdown',e=>{autoOff();pad.setPointerCapture(e.pointerId);drag=true;init();setPad(e)});
pad.addEventListener('pointermove',e=>{if(drag)setPad(e)});
const sup=()=>{drag=false};pad.addEventListener('pointerup',sup);pad.addEventListener('pointercancel',sup);
$('snap').addEventListener('click',e=>{snap=!snap;e.target.textContent='snap '+(snap?'on':'off')});

$('full').addEventListener('click',async()=>{
 const d=document,el=d.documentElement;
 try{
  if(d.fullscreenElement||d.webkitFullscreenElement){(d.exitFullscreen||d.webkitExitFullscreen).call(d)}
  else{await (el.requestFullscreen||el.webkitRequestFullscreen).call(el);try{await screen.orientation.lock('landscape')}catch(_){}}
 }catch(_){$('full').textContent='fullscreen n/a'}
});

// desktop testing: a s d f space = syllables, hold Shift for falsetto
const KEYS='asdf ';
addEventListener('keydown',e=>{if(e.repeat)return;if(e.key==='Shift')fal=true;const i=KEYS.indexOf(e.key.toLowerCase());if(i>=0){e.preventDefault();press(i)}});
addEventListener('keyup',e=>{if(e.key==='Shift')fal=false;const i=KEYS.indexOf(e.key.toLowerCase());if(i>=0)release(i)});

// ---------------------------------------------------------------- game
const APPROACH=2.2;   // seconds for a cue to travel from the right edge to the hit line
const HITX=16;        // hit line position (px) inside the lane
const songSel=$('song');
SONGS.forEach((s,i)=>songSel.add(new Option(s.name,i)));
let paused=false,pausedAt=0;
const sparks=[];
let play=null,result=null,flashes=[],lastMs=performance.now();

function startSong(){
 init();
 const s=SONGS[+songSel.value];
 SPD=+$('speed').value;
 TEMPO=s.tempo||TEMPO0;SHIFT=s.shift||0;
 const notes=s.notes.map(([t,d,v,p,f])=>s.beats
  ?{t:beatSec(t),d:beatSec(t+d)-beatSec(t),v,p,f:!!f,w:0,ep:0,er:0,ev:0,done:false}
  :{t:t/SPD,d:d/SPD,v,p,f:!!f,w:0,ep:0,er:0,ev:0,done:false});
 const free=!!s.free;
 const startMs=performance.now()+(free?60:3000);
 const cbs=s.cb||(s.chords?s.chords.split('').map(c=>c+c).join(''):null);
 if(cbs)startBacking(cbs,startMs,free?1e9:(s.hold!=null?s.hold:cbs.length-4),s.holdLen||3.5,free);
 play={notes,start:startMs,free,end:free?Infinity:Math.max(...notes.map(n=>n.t+n.d))+1.2,score:0,max:notes.length*1000,sw:0,sp:0,sr:0,sv:0};
 result=null;flashes=[];
 $('start').textContent='Stop';$('pause').disabled=false;songSel.disabled=true;$('speed').disabled=true;$('score').textContent='0';
}
function stopSong(finished){
 SHIFT=0;
 if(paused){paused=false;if(ctx)ctx.resume()}
 $('pause').disabled=true;$('pause').textContent='Pause';
 if(finished&&play){
  const w=Math.max(play.sw,1e-6);
  result={score:play.score,max:play.max,pct:Math.round(100*play.score/play.max),
   p:Math.round(100*play.sp/w),r:Math.round(100*play.sr/w),v:Math.round(100*play.sv/w)};
 }
 play=null;stopBacking();if(autoHeld){autoHeld=false;autoNote=null;release(held)};btns.forEach(b=>b.classList.remove('on'));autoShown=false
 $('start').textContent='Start';songSel.disabled=false;$('speed').disabled=false;
}
// leaving the tab: let go of everything, end any running song and silence the audio
function hush(){
 if(play)stopSong(false);
 held=-1;ptr.clear();drag=false;paint();
 if(ctx&&ctx.state==='running')ctx.suspend();
}
document.addEventListener('visibilitychange',()=>{if(document.hidden)hush()});
window.addEventListener('pagehide',hush);
$('start').addEventListener('click',()=>{if(play)stopSong(false);else startSong()});
// pause: freeze the song clock and suspend all audio (backing included), resume where it left off
$('pause').addEventListener('click',()=>{
 if(!play)return;
 if(!paused){
  paused=true;pausedAt=performance.now();
  if(autoHeld){autoHeld=false;autoNote=null}
  if(held>=0)release(held);held=-1;ptr.clear();drag=false;paint();
  btns.forEach(b=>b.classList.remove('on'));
  if(ctx)ctx.suspend();
  $('pause').textContent='Play';
 }else{
  const go=()=>{if(!paused||!play)return;play.start+=performance.now()-pausedAt;paused=false;$('pause').textContent='Pause'};
  if(ctx)ctx.resume().then(go,go);else go();
 }
});

const GRADES=[[.9,'PERFECT','#e0a800'],[.7,'GREAT','#3aa86a'],[.4,'GOOD','#2f8fd8'],[.01,'OK','#8a8a8a'],[-1,'MISS','#d6453d']];

// each frame: score whichever note is active, from how well pitch, register and vowel match
let autoShown=false,autoOn=false,autoNote=null,autoHeld=false;
$('auto').addEventListener('click',e=>{autoOn=!autoOn;e.target.textContent=autoOn?'auto on':'auto off';e.target.classList.toggle('on',autoOn)});
function gameFrame(ms,dt){
 if(!play)return;
 const T=(ms-play.start)/1000;
 // auto-play: perform the active note ourselves (vowel, register and pitch), and let go in the gaps
 if(autoOn){
  const n=play.notes.find(x=>!x.done&&T>=x.t&&T<x.t+x.d);
  if(n){
   if(autoNote!==n){autoNote=n;autoHeld=true;press(SYL.findIndex(s=>s.n===n.v))}
   fal=n.f;target=n.p;
  }else if(autoHeld){autoHeld=false;autoNote=null;release(held)}
 }else if(autoHeld){autoHeld=false;autoNote=null;release(held)}
 if(autoOn||autoShown){autoShown=autoOn&&autoHeld;btns.forEach((b,i)=>b.classList.toggle('on',autoShown&&held===i))}
 for(const n of play.notes){
  if(n.done)continue;
  const a=n.t+Math.min(.12,n.d*.3),b=n.t+n.d;
  if(T>=a&&T<=b){
   let sp=0,sr=0,sv=0;
   if(held>=0){ // sound has to be playing to earn anything
    sp=clamp(1-Math.max(0,Math.abs(semis-n.p)-.4)/1.6,0,1);   // full marks within 0.4 semitone, none beyond 2
    sr=fal===n.f?1:0;
    sv=cur&&cur.n===n.v?1:0;
   }
   n.w+=dt;n.ep+=sp*dt;n.er+=sr*dt;n.ev+=sv*dt;
  }
  if(T>b){
   n.done=true;
   const frac=n.w>0?(.4*n.ep+.3*n.er+.3*n.ev)/n.w:0;   // pitch 40%, register 30%, vowel 30%
   play.score+=Math.round(1000*frac);
   play.sw+=n.w;play.sp+=n.ep;play.sr+=n.er;play.sv+=n.ev;
   const g=GRADES.find(x=>frac>=x[0]);
   flashes.push({t:ms,text:g[1],col:g[2],p:n.p});
   $('score').textContent=play.score;
  }
 }
 if(T>play.end)stopSong(true);
}

// ---------------------------------------------------------------- lane drawing
const lane=$('lane'),lc=lane.getContext('2d');
function rr(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function drawLane(ms){
 const r=lane.getBoundingClientRect(),dpr=window.devicePixelRatio||1,W=r.width,H=r.height;
 if(!W||!H)return;
 const pw=Math.round(W*dpr),ph=Math.round(H*dpr);
 if(lane.width!==pw||lane.height!==ph){lane.width=pw;lane.height=ph}
 lc.setTransform(dpr,0,0,dpr,0,0);
 lc.clearRect(0,0,W,H);
 const cs=getComputedStyle(document.documentElement);
 const fg=cs.getPropertyValue('--fg').trim()||'#2a2a28',bd=cs.getPropertyValue('--bd').trim()||'#c9c4b8';
 const yOf=p=>(1-(p+R+1)/(2*R+2))*H;   // same mapping as the sliders: one semitone of margin above the top note and below the bottom note
 lc.textBaseline='middle';

 // semitone gridlines (they line up with the slider ticks)
 lc.strokeStyle=bd;
 for(let p=-R;p<=R;p++){lc.globalAlpha=p===0?.9:.45;lc.lineWidth=p===0?1.5:1;const y=yOf(p);lc.beginPath();lc.moveTo(0,y);lc.lineTo(W,y);lc.stroke()}
 lc.globalAlpha=1;

 // hit line
 lc.strokeStyle=fg;lc.globalAlpha=.6;lc.lineWidth=2;lc.beginPath();lc.moveTo(HITX,0);lc.lineTo(HITX,H);lc.stroke();lc.globalAlpha=1;

 let T=0;
 if(play){
  T=(ms-play.start)/1000;
  const speed=(W-HITX)/APPROACH,h=Math.max(14,H/(2*R+2)*.82);
  lc.font='bold 12px system-ui,sans-serif';
  for(const n of play.notes){
   const x0=HITX+(n.t-T)*speed,x1=x0+n.d*speed;
   if(x1<HITX||x0>W)continue;
   const dx=Math.max(x0,HITX),w=x1-dx;
   if(w<4)continue;
   const y=yOf(n.p),col=COL[n.v],active=T>=n.t&&T<=n.t+n.d;
   rr(lc,dx,y-h/2,w,h,h/2);
   lc.fillStyle=n.f?pastel(col):col;lc.fill();
   lc.lineWidth=active?3:2;lc.strokeStyle=active?fg:col;lc.stroke();
   if(w>38){lc.fillStyle=n.f?'#222':'#fff';lc.fillText(n.v.toUpperCase(),dx+9,y)}
  }
  if(T<0){
   lc.font='bold 64px system-ui,sans-serif';lc.textAlign='center';lc.fillStyle=fg;lc.globalAlpha=.4;
   lc.fillText(String(Math.ceil(-T)),W/2,H/2);lc.globalAlpha=1;lc.textAlign='left';
  }
 }

 // your current pitch: a marker on the hit line, coloured like the vowel you are singing
 const my=yOf(semis);
 lc.beginPath();lc.arc(HITX,my,9,0,Math.PI*2);
 if(held>=0&&cur){lc.fillStyle=fal?pastel(COL[cur.n]):COL[cur.n];lc.fill()}
 lc.lineWidth=2.5;lc.strokeStyle=fg;lc.stroke();

 // sparkles around the marker while you are right on target (pitch, register and vowel all match the active note)
 {
  let perfect=false;
  if(play&&!paused&&held>=0&&cur){
   const an=play.notes.find(x=>T>=x.t&&T<=x.t+x.d);
   perfect=!!an&&Math.abs(semis-an.p)<=.4&&fal===an.f&&cur.n===an.v;
  }
  if(perfect){
   for(let k=0;k<2;k++){
    const a=Math.random()*Math.PI*2,rad=10+Math.random()*6;
    sparks.push({x:HITX+Math.cos(a)*rad,y:my+Math.sin(a)*rad,vx:Math.cos(a)*(10+Math.random()*25),vy:Math.sin(a)*(10+Math.random()*25)-8,t:ms,life:450+Math.random()*350,s:2.5+Math.random()*3.5});
   }
  }
  for(let i=sparks.length-1;i>=0;i--){
   const s=sparks[i],age=ms-s.t;
   if(age>s.life||paused&&false){sparks.splice(i,1);continue}
   const f=age/s.life,tt=age/1000,x=s.x+s.vx*tt,y=s.y+s.vy*tt;
   lc.globalAlpha=1-f;lc.fillStyle=f<.5?'#fff3b0':'#ffd23f';
   const r=s.s*(1-.5*f);
   lc.beginPath();lc.moveTo(x,y-r*1.6);lc.lineTo(x+r*.35,y-r*.35);lc.lineTo(x+r*1.6,y);lc.lineTo(x+r*.35,y+r*.35);lc.lineTo(x,y+r*1.6);lc.lineTo(x-r*.35,y+r*.35);lc.lineTo(x-r*1.6,y);lc.lineTo(x-r*.35,y-r*.35);lc.closePath();lc.fill();
  }
  lc.globalAlpha=1;
 }
 // judgement flashes
 lc.font='bold 14px system-ui,sans-serif';
 for(let i=flashes.length-1;i>=0;i--){
  const f=flashes[i],age=(ms-f.t)/1000;
  if(age>1){flashes.splice(i,1);continue}
  lc.globalAlpha=1-age;lc.fillStyle=f.col;lc.fillText(f.text,HITX+26,yOf(f.p)-age*16);
 }
 lc.globalAlpha=1;

 lc.textAlign='center';
 if(play&&play.free){
  lc.font='16px system-ui,sans-serif';lc.fillStyle=fg;lc.globalAlpha=.4;
  lc.fillText('Free yodel: sing along, press Stop when you are done',W/2,H/2);lc.globalAlpha=1;
 }
 if(!play&&!result){
  lc.font='16px system-ui,sans-serif';lc.fillStyle=fg;lc.globalAlpha=.55;
  lc.fillText('Pick a song and press Start',W/2,H/2);lc.globalAlpha=1;
 }
 if(result){
  lc.fillStyle=bd;lc.globalAlpha=.35;rr(lc,W/2-170,H/2-54,340,108,16);lc.fill();lc.globalAlpha=1;
  lc.fillStyle=fg;
  lc.font='bold 24px system-ui,sans-serif';lc.fillText('Finished!',W/2,H/2-30);
  lc.font='18px system-ui,sans-serif';lc.fillText('Score '+result.score+' / '+result.max+'  ('+result.pct+'%)',W/2,H/2);
  lc.font='14px system-ui,sans-serif';lc.fillText('Pitch '+result.p+'%  ·  Register '+result.r+'%  ·  Vowel '+result.v+'%',W/2,H/2+28);
 }
 {const cr=SONGS[+songSel.value].credit;if(cr){lc.textAlign='right';lc.font='11px system-ui,sans-serif';lc.fillStyle=fg;lc.globalAlpha=.5;lc.fillText(cr,W-8,H-8);lc.globalAlpha=1}}
 lc.textAlign='left';
}

// ---------------------------------------------------------------- main loop
function tick(){
 requestAnimationFrame(tick);
 semis+=(target-semis)*.35;
 const nowMs=paused?pausedAt:performance.now();
 const dt=Math.min(.05,(nowMs-lastMs)/1000);lastMs=nowMs;

 // register break: when the register flips, add a short volume dip, a puff of breath and a pitch overshoot
 if(held>=0&&prevHeld<0)soundSince=nowMs;prevHeld=held;
 // the break only happens when you cross registers on a note that is already sounding (not after a rest, not on a fresh onset)
 if(fal!==prevFal){if(held>=0&&nowMs-soundSince>80){breakT=nowMs;breakDir=fal?1:-1}prevFal=fal}
 const ba=nowMs-breakT;
 const up=breakDir>0; // chest to falsetto keeps the full crack; falsetto to chest is a gentler drop
 const dip=up?(ba<60?1-.85*Math.sin(Math.PI*ba/60):1):(ba<40?1-.4*Math.sin(Math.PI*ba/40):1);
 const puff=up&&ba<45?.14*Math.sin(Math.PI*ba/45):0;

 let p=B4*2**((semis+SHIFT-12)/12),voiced=0,noise=0,burst=0,t=0,closed=false;
 if(ba<110)p*=2**(breakDir*(up?90:20)*Math.exp(-ba/35)/1200);
 if(cur){
  const e=nowMs-t0,vt=(e-500)/1000;
  if(vt>0)p*=2**(clamp(vt/.5,0,1)*9*Math.sin(2*Math.PI*5.5*vt)/1200); // vibrato after 0.5 s
  const vIn=clamp((e-cur.vs)/Math.max(cur.vr,12),0,1);
  t=clamp((e-cur.vs-cur.on)/cur.gl,0,1);
  voiced=vIn*(cur.ol+(1-cur.ol)*t);
  if(cur.c>0&&e<cur.vs){voiced=.05;closed=true} // faint "voice bar" while a voiced stop is closed
  const br=fal?.03:0;
  noise=(cur.asp?.12+(br-.12)*vIn:br*vIn)+puff;
  burst=cur.b&&e>=cur.c&&e<cur.c+cur.b?Math.exp(-(e-cur.c)/6):0;
 }
 if(fal)p*=2; // falsetto sits an octave above chest at the same height
 if(A){
  const now=ctx.currentTime,T=(prm,v,tc=.01)=>prm.setTargetAtTime(v,now,tc);
  if(cur){
   for(let i=0;i<3;i++){
    let f=closed&&cur.ci?cur.ci[i]:cur.fi[i]+(cur.ft[i]-cur.fi[i])*t;
    if(fal&&i===0)f=Math.max(f,p); // F1 follows the pitch in falsetto
    T(A.vf[i].frequency,f);T(A.vf[i].Q,f/BW[i]);T(A.af[i].frequency,f);T(A.af[i].Q,f/BW[i]);
   }
   const gs=cur.fg||FG,up=cur.up===undefined?1:cur.up; // per-syllable formant levels; 'oo' is darker
   for(let i=0;i<3;i++)T(A.vgn[i].gain,gs[i]);
   A.ups.forEach(([g,gv])=>T(g.gain,gv*up));T(A.sg.gain,.2*up);
   T(A.bf[0].frequency,cur.fi[1]);T(A.bf[1].frequency,cur.fi[2]);
  }
  T(A.chest.frequency,p,.012);T(A.fals.frequency,p,.012);
  T(A.cg.gain,fal?0:voiced*dip*2.1,.01);T(A.fg.gain,fal?voiced*dip*.9:0,.01);
  T(A.ag.gain,noise*.6);T(A.bg.gain,burst*.3,.004);
  T(A.vlp.frequency,fal?4800:4100,.03);
  T(A.ln.gain,cur&&cur.lat?-14*(1-t):0);
  T(A.m.gain,held>=0?.192:0,held>=0?.006:.1);
 }
 const midi=69+12*Math.log2(p/440),n=Math.round(midi);
 const top=(1-(target+R+1)/(2*R+2))*100+'%';
 kF.style.top=kC.style.top=top;
 const sc=held>=0?COL[SYL[held].n]:null;
 slC.style.backgroundColor=sc||'';slF.style.backgroundColor=sc?pastel(sc):'';
 kF.style.display=fal?'block':'none';kC.style.display=fal?'none':'block';

 paintBtns();
 if(!paused)gameFrame(nowMs,dt);
 drawLane(nowMs);
}
tick();
</script>
</body>
</html>
